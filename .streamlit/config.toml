[server]
headless = true  # no "enter your email" prompt, no auto-opened browser
port = 8501
# GitHub Codespaces serves the app through its port-forwarding proxy, whose
# requests fail Streamlit's CORS / XSRF origin checks; disable them for local use.
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

# Colours follow a validated colour-blind-safe palette (see analysis/theme.py);
# each mode has its own steps, tuned for its background.
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#2c2c2a"
textColor = "#f0efec"
borderColor = "#383835"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[client]
toolbarMode = "minimal"  # hide developer-only menu items (e.g. Deploy) from viewers
